services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8080"  # host:container — container luôn nghe 8080 (yêu cầu GreenNode AgentBase)
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8080"  # host:container — container luôn nghe 8080 (nginx, xem Dockerfile.ui)
    environment:
      # Trong mạng docker-compose, gọi service khác qua tên service, không phải
      # localhost — "api" là tên service ở trên, port 8080 là port container thật.
      - API_BASE_URL=http://api:8080
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  # Chỉ khởi động khi cần (profile "postgres") — mặc định `docker compose up`
  # KHÔNG chạy service này, giữ nguyên luồng SQLite cũ (DB_BACKEND=sqlite mặc
  # định, xem src/config.py). Dùng khi muốn chạy app với DB_BACKEND=postgres,
  # hoặc chạy test PostgresStorage (tests/storage/test_postgres_storage.py):
  #   docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=web_extract_agent
      - POSTGRES_USER=web_extract_agent
      - POSTGRES_PASSWORD=web_extract_agent_dev_only
    ports:
      - "5432:5432"  # để venv/test chạy trực tiếp trên máy host kết nối được
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_extract_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
