# /health tráº£ 200 tÄ©nh (KHÃ”NG qua Streamlit â€” váº«n "sá»‘ng" ká»ƒ cáº£ khi Streamlit
# Ä‘ang khá»Ÿi Ä‘á»™ng cháº­m hoáº·c treo táº¡m thá»i); má»i request khÃ¡c proxy sang
# Streamlit ná»™i bá»™ (127.0.0.1:8501, khÃ´ng expose ra ngoÃ i container).
server {
    listen 8080;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Readiness checks Streamlit, unlike the nginx-only liveness above.
    location = /ready {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit dÃ¹ng WebSocket Ä‘á»ƒ cáº­p nháº­t UI theo thá»i gian thá»±c â€” thiáº¿u
        # 2 header Upgrade/Connection nÃ y thÃ¬ UI load Ä‘Æ°á»£c nhÆ°ng máº¥t tÆ°Æ¡ng tÃ¡c.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
