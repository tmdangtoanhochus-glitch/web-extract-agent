# nginx đứng trước Streamlit trong container UI — lý do cần lớp này: Streamlit
# không có sẵn route /health khớp yêu cầu liveness của GreenNode AgentBase.
# /health trả 200 tĩnh (KHÔNG qua Streamlit — vẫn "sống" kể cả khi Streamlit
# đang khởi động chậm hoặc treo tạm thời); mọi request khác proxy sang
# Streamlit nội bộ (127.0.0.1:8501, không expose ra ngoài container).
server {
    listen 8080;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Readiness checks Streamlit, unlike the nginx-only liveness above.
    location = /ready {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit dùng WebSocket để cập nhật UI theo thời gian thực — thiếu
        # 2 header Upgrade/Connection này thì UI load được nhưng mất tương tác.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
